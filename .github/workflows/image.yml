name: image
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - run: go vet ./...
      - run: go test -count=1 ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # GitOps: point deploy/kustomization.yaml at the image just built. Argo CD
  # notices the commit and rolls it out. Commits made with GITHUB_TOKEN do not
  # start another workflow run, so this does not loop.
  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Update the image tag
        env:
          TAG: sha-${{ github.sha }}
        run: |
          sed -i -E "s/^(    newTag: ).*/\1${TAG}/" deploy/kustomization.yaml
          grep -q "newTag: ${TAG}$" deploy/kustomization.yaml
          if git diff --quiet; then echo "already deployed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${TAG}"
          git push origin HEAD:main
