name: image
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Tests with the race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Known vulnerabilities in reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # SBOM and build provenance are attached to the image as attestations.
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # A pushed image is only deployed if it has no fixable high or critical
  # vulnerabilities. Trivy runs from a pinned image digest, not a third-party action.
  scan:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Trivy image scan
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          docker run --rm aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress --platform linux/amd64 "$IMAGE"

  # GitOps: point deploy/kustomization.yaml at the image just built. Argo CD
  # notices the commit and rolls it out. Commits made with GITHUB_TOKEN do not
  # start another workflow run, so this does not loop.
  deploy:
    needs: scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Update the image tag
        env:
          TAG: sha-${{ github.sha }}
        run: |
          sed -i -E "s/^(    newTag: ).*/\1${TAG}/" deploy/kustomization.yaml
          grep -q "newTag: ${TAG}$" deploy/kustomization.yaml
          if git diff --quiet; then echo "already deployed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${TAG}"
          git push origin HEAD:main
