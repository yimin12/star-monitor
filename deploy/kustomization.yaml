# Argo CD deploys this directory to the star-monitor namespace.
# .forgejo/workflows/image.yml sets newName (Forgejo's registry) and newTag after each image build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: star-monitor
resources:
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/yimin12/star-monitor
    newName: git.dev.topymh.org/yimin12/star-monitor
    newTag: sha-2fc7a43b0e7b44b468d96abc778fce137e1a6652
